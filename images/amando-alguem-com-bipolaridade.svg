<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#d98e2b" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#d98e2b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#faf6f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d98e2b"/>
      <stop offset="100%" stop-color="#7b4fb5"/>
