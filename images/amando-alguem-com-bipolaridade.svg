    <circle cx="623" cy="261" r="90" fill="#7b4fb5" opacity="0.10" filter="url(#blur)"/>
  <circle cx="600" cy="300" r="130" fill="url(#accent)" opacity="0.9"/>
    <path d="M600 170 A130 130 0 0 0 600 430 A100 100 0 0 1 600 170 z" fill="#faf6f1"/>
