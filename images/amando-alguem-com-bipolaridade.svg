  <rect width="1200" height="600" fill="#faf6f1"/>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="337" cy="229" r="150" fill="#d98e2b" opacity="0.14" filter="url(#blur)"/>
