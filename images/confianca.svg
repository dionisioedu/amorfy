    <path d="M600 322 c-8 -10 -30 -16 -30 -32 c0 -13 10 -22 22 -22 c7 0 13 3 8 0 c-5 3 1 0 8 0 c12 0 22 9 22 22 c0 16 -22 22 -30 32 z" fill="#c13a58" opacity="0.9"/>
    <circle cx="470" cy="250" r="8" fill="#d98e2b" opacity="0.7"/>
    <circle cx="730" cy="350" r="6" fill="#d98e2b" opacity="0.7"/>
  <rect width="1200" height="600" filter="url(#grain)" opacity="1"/>
