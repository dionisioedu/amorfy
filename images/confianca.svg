  <rect width="1200" height="600" fill="#faf6f1"/>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="190" cy="210" r="150" fill="#c13a58" opacity="0.14" filter="url(#blur)"/>
    <circle cx="830" cy="510" r="190" fill="#d98e2b" opacity="0.12" filter="url(#blur)"/>
    <circle cx="630" cy="330" r="90" fill="#d98e2b" opacity="0.10" filter="url(#blur)"/>
  <g stroke="#a02545" fill="none" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <circle cx="520" cy="300" r="120"/>
      <circle cx="680" cy="300" r="120"/>
